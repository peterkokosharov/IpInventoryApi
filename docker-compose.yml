services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ipinventory
      POSTGRES_USER: ipinventory
      POSTGRES_PASSWORD: ipinventory
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipinventory -d ipinventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONN: "dbname=ipinventory user=ipinventory password=ipinventory host=db port=5432"
      PORT: "18080"
    ports:
      - "18080:18080"

volumes:
  pgdata:
