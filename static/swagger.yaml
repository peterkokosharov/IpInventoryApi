openapi: 3.0.3
info:
  title: IP Inventory API
  version: 1.1.0
  description: REST API for managing IP addresses (IPv4/IPv6)
servers:
  - url: http://localhost:18080
paths:
  /ip-inventory/ip-pool:
    post:
      summary: Add IP addresses to the pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIpPoolRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid request (bad JSON, invalid IP, ipType does not match the address)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ip-inventory/reserve-ip:
    post:
      summary: Reserve IP address(es) for a service
      description: >-
        ipType IPv4 or IPv6 reserves one address of that type, Both reserves one IPv4
        and one IPv6 (all or nothing). Idempotent: addresses already reserved for the
        serviceId are returned instead of reserving new ones. A reservation that is
        not assigned within the configured time expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveIpRequest'
      responses:
        '200':
          description: Reserved IPs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveIpResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No free IP of the requested type is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ip-inventory/assign-ip-serviceId:
    post:
      summary: Assign reserved IP to a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIpRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid request (bad JSON, invalid IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: IP is not in the pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: IP is not reserved for this serviceId, the reservation expired, or the IP is already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ip-inventory/terminate-ip-serviceId:
    post:
      summary: Terminate IP assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateIpRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid request (bad JSON, invalid IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: IP is not in the pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: IP is not assigned to this serviceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ip-inventory/serviceId-change:
    post:
      summary: Change the assignment from the old serviceId to a new serviceId
      description: Moves the active assignments (and open reservations) of serviceIdOld to serviceId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceIdChangeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid request (missing or wrong fields, old and new serviceId equal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: serviceIdOld has no assigned or reserved IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ip-inventory/serviceId:
    get:
      summary: Get IPs by service ID
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: IPs assigned to the serviceId (empty array if none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveIpResponse'
        '400':
          description: Missing serviceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    IpItem:
      type: object
      properties:
        ip:
          type: string
        ipType:
          type: string
          enum: [IPv4, IPv6]

    AddIpPoolRequest:
      type: object
      properties:
        ipAddresses:
          type: array
          items:
            $ref: '#/components/schemas/IpItem'

    ReserveIpRequest:
      type: object
      properties:
        serviceId:
          type: string
        ipType:
          type: string
          enum: [IPv4, IPv6, Both]

    AssignIpRequest:
      type: object
      properties:
        serviceId:
          type: string
        ipAddresses:
          type: array
          items:
            type: object
            properties:
              ip:
                type: string

    TerminateIpRequest:
      type: object
      properties:
        serviceId:
          type: string
        ipAddresses:
          type: array
          items:
            type: object
            properties:
                ip:
                  type: string

    ServiceIdChangeRequest:
      type: object
      required: [serviceIdOld, serviceId]
      properties:
        serviceIdOld:
          type: string
        serviceId:
          type: string

    ReserveIpResponse:
      type: object
      properties:
        ipAddresses:
          type: array
          items:
            $ref: '#/components/schemas/IpItem'

    StandardResponse:
      type: object
      properties:
        statusCode:
          type: string
        statusMessage:
          type: string
          example: Successful operation. OK

    ErrorResponse:
      type: object
      description: >-
        statusCode 1000-1003 invalid input, 2001 no free IP, 3001 not reserved,
        3002 IP not in pool, 4001 not assigned, 5001 missing parameter,
        6001 no IP for serviceIdOld, 9000 internal error
      properties:
        statusCode:
          type: string
        statusMessage:
          type: string
        details:
          type: string
